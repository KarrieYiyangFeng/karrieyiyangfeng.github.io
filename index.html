<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>KARRIE YIYANG FENG</title>
  <link rel="stylesheet" href="/login-cursor.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #e9e9ea url("/login-background.png") center / cover no-repeat fixed;
      color: #fff;
      font: 1rem Helvetica, Arial, sans-serif;
    }
    main { width: min(100%, 24rem); }
    h1 {
      margin: 0 0 1.75rem;
      text-shadow: 0 1px 6px #323235;
      font-size: clamp(1.15rem, 6vw, 2rem);
      font-weight: 300;
      text-align: center;
      white-space: nowrap;
    }
    form { display: grid; gap: .8rem; }
    p { margin: 0 0 .5rem; text-shadow: 0 1px 6px #323235; }
    .password-field { position: relative; }
    input[type="password"] {
      width: 100%;
      font: inherit;
      padding: .85rem 3.25rem .85rem .85rem;
      border: 1px solid transparent;
      background: #fff;
      color: #323235;
      box-shadow: 0 0 5px 1px rgba(255, 255, 255, 0.85);
    }
    input::placeholder { color: #aaa; opacity: 1; }
    input:focus::placeholder { color: transparent; }
    button {
      position: absolute;
      inset: 0 0 0 auto;
      width: 3rem;
      border: 0;
      background: transparent;
      color: #323235;
      font: inherit;
      font-size: 1.4rem;
      cursor: pointer;
    }
    button span { display: inline-block; filter: blur(1px); }
    button:hover span, button:focus-visible span { filter: none; }
    button:focus-visible { outline: 2px solid #323235; outline-offset: -4px; }
  </style>
</head>
<body>
  <main>
    <h1>KARRIE YIYANG FENG</h1>
    <p id="password-status" aria-live="polite"></p>
    <noscript><p>Enable JavaScript to open the portfolio.</p></noscript>
    <form id="portfolio-unlock" method="post" action="/portfolio-gate.html">
      <div class="password-field">
        <input id="password" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password..." required>
        <button type="submit" aria-label="Open portfolio"><span aria-hidden="true">→</span></button>
      </div>
    </form>
  </main>
  <script src="/login-cursor.js" defer></script>
  <script src="/gate.js" defer></script>
</body>
</html>
